name: Deploy Pomopomo
on:
  push:
    branches: [main]
    paths-ignore: ['firmware/**', 'docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pomopomo-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:cloudflare
      - name: Apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5db38b3e28806c335ec5a2b16e79858f'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add the CLOUDFLARE_API_TOKEN repository secret. See docs/SELF_HOSTING.md.'
            exit 1
          fi
          npm run db:migrate:cloudflare
          npm run deploy:cloudflare
          npx wrangler deploy --config gateway/wrangler.jsonc
